<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Jogo da Memória 🎮</h1>
        <div class="placar">
            <div class="pares">Pares acertados: <span id="pares-acertados">0</span>/8</div>
            <div class="erros">Erros consecutivos: <span id="erros-consecutivos">0</span>/5</div>
        </div>
        <div id="tabuleiro" class="tabuleiro"></div>
        <div id="mensagem" class="mensagem"></div>
        <button id="reiniciar" class="reiniciar">Reiniciar Jogo</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
